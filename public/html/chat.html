<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DrizzleChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Dark Mode */
  body.dark-mode {
    background: #252526;
  }

  body.dark-mode #chatContainer {
    background: #252526;
    color: #fff;
  }

  body.dark-mode #chatHeader {
    border-bottom-color: #333;
    color: #fff;
  }

  body.dark-mode #chatInputArea {
    border-top-color: #333;
  }

  body.dark-mode #chatInput {
  background: #fff;
  color: #000;
  border-color: #333;
  }

  body.dark-mode .msg.user {
    background: #1a1a1a;
    color: #fff;
    border: 2px solid #fff;
  }

  body.dark-mode .modal-content {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
  }

  body.dark-mode .close-btn {
    color: #999;
  }

  body.dark-mode .close-btn:hover {
    color: #fff;
  }

  body.dark-mode .setting-item {
    border-bottom-color: #333;
  }

  body.dark-mode #sidebarToggle {
    background: #000;
    color: #fff;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    background: #578676;
    color: white;
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease;
    overflow: hidden;
  }

  .sidebar-inner {
    width: 260px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #sidebar.collapsed {
    width: 0;
  }

  #sidebar header {
    padding: 16px;
    font-weight: bold;
    white-space: nowrap;
  }

  #conversations {
    flex: 1;
    overflow-y: auto;
  }

  .conversation {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }

  .conversation:hover {
    background: rgba(0,0,0,0.2);
  }

  #settings {
    padding: 12px 16px;
    cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.2);
    margin-top: auto;
  }

  #settings:hover {
    background: rgba(0,0,0,0.2);
  }

  /* Toggle button (ALWAYS visible) */
  #sidebarToggle {
    position: absolute;
    top: 10px;
    left: 270px;
    width: 32px;
    height: 32px;
    background: white;
    color: black;
    border-radius: 0 6px 6px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: left 0.3s ease;
    z-index: 20;
    font-size: 35px;
  }

  #sidebar.collapsed + #sidebarToggle {
    left: 0;
    border-radius: 0 6px 6px 0;
  }

  /* Main chat */
  #chatContainer {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: white;
  }

  #chatHeader {
    padding: 16px;
    border-bottom: 1px solid #ddd;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  #chatMessages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }

  .msg {
    max-width: 70%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .user {
    background: #e0e0e0;
    margin-left: auto;
  }

  .ai {
    background: #578676;
    color: white;
    margin-right: auto;
  }

  #chatInputArea {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid #ddd;
  }

  #modelMenu {
    min-width: 180px;
    max-width: 240px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #fff;
    font-size: 13px;
  }

  #chatInput {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    overflow-y: auto; /* scroll once max height reached */
  }


  #sendBtn {
    padding: 10px 16px;
    background: #578676;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

    /* Title + logo container */
  .sidebar-title {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  /* Small sidebar logo */
  .sidebar-logo {
    height: 30px;
    width: auto;
    margin-top: -13px;
  }

  /* Settings Modal */
  #settingsModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  #settingsModal.open {
    display: flex;
  }

  .modal-content {
    background: white;
    padding: 24px;
    border-radius: 12px;
    width: 400px;
    max-width: 90%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 20px;
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #666;
  }

  .close-btn:hover {
    color: #000;
  }

  .setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }

  .setting-item input {
    width: 220px;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .setting-status {
    font-weight: 600;
    color: #333;
  }

  .settings-action-btn {
    background: #578676;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }

  .settings-action-btn:hover {
    filter: brightness(0.95);
  }

  .setting-item:last-child {
    border-bottom: none;
  }

  .toggle-switch {
    position: relative;
    width: 50px;
    height: 26px;
    background: #ccc;
    border-radius: 13px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: white;
    top: 2px;
    left: 2px;
    transition: left 0.3s;
  }

  .toggle-switch.active {
    background: #578676;
  }

  .toggle-switch.active::after {
    left: 26px;
  }

  body.dark-mode .setting-item input {
    background: #111;
    color: #fff;
    border-color: #333;
  }

  body.dark-mode .setting-status {
    color: #ddd;
  }

  body.dark-mode #modelMenu {
    background: #111;
    color: #fff;
    border-color: #333;
  }

  @media (max-width: 720px) {
    #chatInputArea {
      flex-wrap: wrap;
    }

    #modelMenu {
      width: 100%;
      max-width: none;
      order: 3;
    }

    #chatInput {
      min-width: 0;
      width: calc(100% - 96px);
    }
  }

  </style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-inner">
    <header>
    <div class="sidebar-title">
      <img src="../media/drizzle_logo_2.png" alt="Drizzle AI Logo" class="sidebar-logo">
      <span class="title-text">DrizzleChat</span>
    </div>
    </header>


    <div id="conversations">
      <div class="conversation">🌱 Plant Care Help</div>
      <div class="conversation">☁️ Cloud Services</div>
      <div class="conversation">🤖 AI Support</div>
    </div>

    <div id="settings" onclick="openSettings()"><i class="fa fa-gear"></i> Settings</div>
  </div>
</div>

<!-- Toggle Button -->
<div id="sidebarToggle" onclick="toggleSidebar()">☰</div>

<!-- Main Chat -->
<div id="chatContainer">
  <div id="chatHeader">Plant Care Help</div>

  <div id="chatMessages"></div>

  <div id="chatInputArea">
    <select id="modelMenu" title="Chat model">
      <option value="">Model: default</option>
      <option value="GPT-OSS-20B-Med-MXFP4">GPT-OSS-20B-Med-MXFP4</option>
      <option value="GPT-OSS-20B-High-MXFP4">GPT-OSS-20B-High-MXFP4</option>
    </select>
    <textarea
    id="chatInput"
    placeholder="Ask DrizzleChat..."
    rows="1"
    ></textarea>
    <button id="sendBtn" onclick="sendChat()">Send</button>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" onclick="closeSettingsOnOutside(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i class="fa fa-gear"></i> Settings</h2>
      <button class="close-btn" onclick="closeSettings()">×</button>
    </div>
    <div class="setting-item">
      <span><i class="fa fa-moon-o" aria-hidden="true"></i> Dark Mode</span>
      <div class="toggle-switch" onclick="toggleDarkMode(event)"></div>
    </div>
    <div class="setting-item">
      <label for="apiBaseInput">🔗 API Base</label>
      <input id="apiBaseInput" type="text" placeholder="http://127.0.0.1:5000" />
    </div>
    <div class="setting-item">
      <span>🔊 Notification Sound</span>
      <span id="soundStatus" class="setting-status">Default sound</span>
    </div>
    <div class="setting-item">
      <span><i class="fa fa-trash" aria-hidden="true"></i> Clear History</span>
      <button class="settings-action-btn" onclick="clearChatHistory()">Clear</button>
    </div>
  </div>
</div>

<script>

  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const toggle = document.getElementById("sidebarToggle");

    sidebar.classList.toggle("collapsed");

    toggle.textContent = sidebar.classList.contains("collapsed") ? "☰" : "☰";
  }

  function openSettings() {
    document.getElementById("settingsModal").classList.add("open");
    updateSoundStatus();
  }

  function closeSettings() {
    document.getElementById("settingsModal").classList.remove("open");
  }

  function closeSettingsOnOutside(event) {
    if (event.target.id === "settingsModal") {
      closeSettings();
    }
  }

  function toggleDarkMode(event) {
    event.stopPropagation();
    const toggle = event.currentTarget;
    toggle.classList.toggle("active");
    document.body.classList.toggle("dark-mode");
    
    // Save preference
    if (document.body.classList.contains("dark-mode")) {
      localStorage.setItem("darkMode", "enabled");
    } else {
      localStorage.setItem("darkMode", "disabled");
    }
  }

  // Restore dark mode preference on page load
  window.addEventListener("DOMContentLoaded", async function() {
    await loadBackendConfig();
    const darkMode = localStorage.getItem("darkMode");
    if (darkMode === "enabled") {
      document.body.classList.add("dark-mode");
      document.querySelector(".toggle-switch").classList.add("active");
    }

    const apiBaseInput = document.getElementById("apiBaseInput");
    if (apiBaseInput) {
      apiBaseInput.value = getApiBase();
      apiBaseInput.addEventListener("change", function () {
        const value = apiBaseInput.value.trim();
        if (value) {
          localStorage.setItem("apiBase", value);
        } else {
          localStorage.removeItem("apiBase");
          apiBaseInput.value = getApiBase();
        }
      });
    }

    updateSoundStatus();
  });

  //async function loadBackendConfig() {
    //try {
      //const response = await fetch("../config.json"); 
      // myöhemmin voit vaihtaa: http://127.0.0.1:5000/config.json

      //if (!response.ok) {
        //console.log("Config not found, using defaults");
        //return;
      //}

      //const config = await response.json();

      //if (config.apiBase) {
        //localStorage.setItem("apiBase", config.apiBase);
      //}

      //if (config.defaultSound) {
        //localStorage.setItem("customSound", config.defaultSound);
      //}

      //if (config.darkMode === true) {
        //localStorage.setItem("darkMode", "enabled");
      //}

      //console.log("Backend config loaded");
    //} catch (error) {
      //console.log("Could not load backend config:", error.message);
    //}
  //}

  function getApiBase() {
    return localStorage.getItem("apiBase") || "http://127.0.0.1:5000";
  }

  function getCustomSound() {
    return localStorage.getItem("customSound") || "";
  }

  function updateSoundStatus() {
    const soundStatus = document.getElementById("soundStatus");
    if (!soundStatus) return;
    soundStatus.textContent = getCustomSound() ? "Custom sound" : "Default sound";
  }

  function playSound() {
    const customSoundPath = getCustomSound();
    console.log("Attempting to play sound from:", customSoundPath);
    
    if (customSoundPath) {
      // Try to play custom sound directly
      const audio = new Audio(customSoundPath);
      
      audio.addEventListener('canplay', function() {
        console.log("Sound loaded successfully, playing:", customSoundPath);
        audio.play().catch((err) => {
          console.log("Error playing sound:", err);
          playNotificationSound();
        });
      });
      
      audio.addEventListener('error', function(e) {
        console.log("Failed to load custom sound. Error:", e.target.error, "Path:", customSoundPath);
        playNotificationSound();
      });
      
      audio.load();
    } else {
      // Play default sound
      playNotificationSound();
    }
  }

  function playNotificationSound() {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      // Create a pleasant notification sound: two beeps
      oscillator.frequency.value = 800; // frequency in Hz
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
      
      // Second beep
      setTimeout(() => {
        const osc2 = audioContext.createOscillator();
        const gain2 = audioContext.createGain();
        osc2.connect(gain2);
        gain2.connect(audioContext.destination);
        
        osc2.frequency.value = 1000;
        osc2.type = 'sine';
        
        gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
        
        osc2.start(audioContext.currentTime);
        osc2.stop(audioContext.currentTime + 0.15);
      }, 150);
    } catch (error) {
      console.log("Could not play notification sound:", error);
    }
  }

  function formatUserMessage(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
    return escaped.replace(/\n/g, "<br>");
  }

  async function fetchChatHistory() {
    const apiBase = getApiBase();
    const response = await fetch(`${apiBase}/context`);
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || `Failed to load history (${response.status})`);
    }

    const history = Array.isArray(data.history) ? data.history : [];
    return history
      .filter(
        (item) =>
          item &&
          (item.role === "user" || item.role === "assistant") &&
          typeof item.content === "string"
      )
      .map((item) => ({
        role: item.role === "assistant" ? "ai" : "user",
        text: item.content,
      }));
  }

  async function clearChatHistory() {
    const shouldClear = window.confirm("Clear all chat history? This cannot be undone.");
    if (!shouldClear) return;

    try {
      const apiBase = getApiBase();
      const response = await fetch(`${apiBase}/context`, {
        method: "DELETE",
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || `Failed to clear history (${response.status})`);
      }

      document.getElementById("chatMessages").innerHTML = "";
    } catch (error) {
      appendMessage("ai", `Error clearing history: ${error.message || "Failed to connect to server"}`);
    }
  }

  function appendMessage(role, text) {
    const chat = document.getElementById("chatMessages");
    const msgClass = role === "user" ? "user" : "ai";
    chat.innerHTML += `<div class="msg ${msgClass}">${formatUserMessage(text)}</div>`;
  }

  async function restoreChatHistory() {
    const chat = document.getElementById("chatMessages");
    chat.innerHTML = "";
    const history = await fetchChatHistory();
    for (const message of history) {
      const msgClass = message.role === "user" ? "user" : "ai";
      chat.innerHTML += `<div class="msg ${msgClass}">${formatUserMessage(message.text)}</div>`;
    }
    chat.scrollTop = chat.scrollHeight;
  }


  async function sendChat() {
    const input = document.getElementById("chatInput");
    const chat = document.getElementById("chatMessages");
    const text = input.value.trim();
    if (!text) return;

    appendMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    input.style.overflowY = "hidden";
    chat.scrollTop = chat.scrollHeight;

    const thinking = document.createElement("div");
    thinking.className = "msg ai";
    thinking.textContent = "Thinking...";
    chat.appendChild(thinking);
    chat.scrollTop = chat.scrollHeight;

    try {
      const apiBase = getApiBase();
      const res = await fetch(`${apiBase}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, args: ["-notts"] }),
      });

      const data = await res.json();
      thinking.remove();
      if (!res.ok) {
        appendMessage("ai", `Error: ${data.error || "Request failed with status " + res.status}`);
      } else {
        await restoreChatHistory();
        playSound();
      }
    } catch (error) {
      thinking.remove();
      appendMessage("ai", `Error: ${error.message || "Failed to connect to server"}`);
    }

    chat.scrollTop = chat.scrollHeight;
  }
  // Press enter to send
  const chatInput = document.getElementById("chatInput");

  chatInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
    // Shift+Enter will naturally insert a new line in textarea
  });

  const MAX_LINES = 5;

  chatInput.addEventListener("input", function () {
    this.style.height = "auto";

    const lineHeight = parseFloat(getComputedStyle(this).lineHeight);
    const maxHeight = lineHeight * MAX_LINES + 20; // padding buffer

    if (this.scrollHeight > maxHeight) {
      this.style.height = maxHeight + "px";
      this.style.overflowY = "auto";
    } else {
      this.style.height = this.scrollHeight + "px";
      this.style.overflowY = "hidden";
    }
  });

  restoreChatHistory().catch((error) => {
    appendMessage("ai", `Error loading history: ${error.message || "Failed to connect to server"}`);
  });
</script>

</body>
</html>
